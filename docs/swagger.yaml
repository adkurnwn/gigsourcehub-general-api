definitions:
  gorm_model.UserResp:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  request_model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  request_model.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  response.Base:
    properties:
      data: {}
      message:
        type: string
      status:
        type: integer
      validation:
        additionalProperties:
          type: string
        type: object
    type: object
  response.List:
    properties:
      limit:
        type: integer
      list:
        items: {}
        type: array
      page:
        type: integer
      total:
        type: integer
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login use email and password
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gorm_model.UserResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      summary: Login as member
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Get detail current member
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gorm_model.UserResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Detail member
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new member
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_model.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gorm_model.UserResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      summary: Register member
      tags:
      - auth
  /sample/user/detail/{id}:
    get:
      consumes:
      - application/json
      description: Get Detail member by id
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gorm_model.UserResp'
      security:
      - BearerAuth: []
      summary: Detail member
      tags:
      - sample
  /sample/user/export:
    get:
      consumes:
      - application/json
      description: Export data member
      produces:
      - application/json
      responses:
        "200":
          description: base64 encoded
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Export member
      tags:
      - sample
  /sample/user/list:
    get:
      consumes:
      - application/json
      description: Get list all member
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.List'
      security:
      - BearerAuth: []
      summary: List member
      tags:
      - sample
securityDefinitions:
  BearerAuth:
    description: 'Insert JWT Token with format: **Bearer {your token}**'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
