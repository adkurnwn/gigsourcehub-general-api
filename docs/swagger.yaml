definitions:
  gorm_model.AuthMeResp:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      profile_picture:
        type: string
      system_role_name:
        type: string
    type: object
  gorm_model.JobRoleResp:
    properties:
      id:
        type: string
      name:
        type: string
      sector:
        $ref: '#/definitions/gorm_model.SectorResp'
      sector_id:
        type: string
    type: object
  gorm_model.ProvinsiResp:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  gorm_model.SectorResp:
    properties:
      created_at:
        type: string
      hex_code:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  gorm_model.UserResp:
    properties:
      account_status:
        type: string
      assigned_role_id:
        type: string
      bidang:
        type: string
      birthdate:
        type: string
      candidate_level:
        type: string
      email:
        type: string
      gpa:
        type: number
      id:
        type: string
      is_bookmark:
        type: boolean
      job_roles:
        items:
          $ref: '#/definitions/gorm_model.JobRoleResp'
        type: array
      job_title_id:
        type: string
      kabupaten_kota_id:
        type: string
      major:
        type: string
      must_reset_password:
        type: boolean
      name:
        type: string
      phone_number:
        type: string
      portofolio_link:
        type: string
      profile_picture:
        type: string
      province:
        $ref: '#/definitions/gorm_model.ProvinsiResp'
      recruitment_status_hex_code:
        type: string
      recruitment_status_id:
        type: string
      recruitment_status_name:
        type: string
      school_university:
        type: string
      summary:
        type: string
      system_role_name:
        type: string
      tech_stack:
        type: string
      unavailable_until:
        type: string
      years_experience:
        type: integer
    type: object
  request_model.ConfirmCVRequest:
    properties:
      edited_data:
        additionalProperties: true
        type: object
    required:
    - edited_data
    type: object
  request_model.CreateBookmarkRequest:
    properties:
      candidate_id:
        type: string
    required:
    - candidate_id
    type: object
  request_model.CreateConversationRequest:
    properties:
      candidate_user_id:
        type: string
      subrequest_id:
        type: string
    required:
    - candidate_user_id
    - subrequest_id
    type: object
  request_model.CreateJobRoleRequest:
    properties:
      name:
        type: string
      sector_id:
        type: string
    required:
    - name
    - sector_id
    type: object
  request_model.CreateJobTitleRequest:
    properties:
      name:
        type: string
      sector_id:
        type: string
    required:
    - name
    - sector_id
    type: object
  request_model.CreateRecruitmentStatusRequest:
    properties:
      hex_code:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    required:
    - name
    type: object
  request_model.CreateRequestRequest:
    properties:
      due_date:
        type: string
      project_name:
        type: string
      subrequests:
        items:
          $ref: '#/definitions/request_model.CreateSubrequestRequest'
        minItems: 1
        type: array
      urgency:
        enum:
        - Low
        - Medium
        - High
        type: string
    required:
    - project_name
    - subrequests
    - urgency
    type: object
  request_model.CreateSectorRequest:
    properties:
      hex_code:
        type: string
      name:
        type: string
    type: object
  request_model.CreateSubrequestRequest:
    properties:
      job_role_id:
        type: string
      min_years_experience:
        minimum: 0
        type: integer
      notes:
        type: string
      tech_stack:
        items:
          type: string
        type: array
    required:
    - min_years_experience
    type: object
  request_model.CreateUserBySuperadminRequest:
    properties:
      account_status:
        type: string
      assigned_role_id:
        type: string
      email:
        type: string
      job_title_id:
        type: string
      name:
        type: string
      password:
        type: string
      system_role_id:
        type: string
    type: object
  request_model.EditUserBySuperadminRequest:
    properties:
      account_status:
        type: string
      assigned_role_id:
        type: string
      job_title_id:
        type: string
      name:
        type: string
      system_role_id:
        type: string
    type: object
  request_model.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  request_model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  request_model.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  request_model.ResetPasswordRequest:
    properties:
      password:
        type: string
      token:
        type: string
    type: object
  request_model.SearchRequest:
    properties:
      query:
        type: string
    required:
    - query
    type: object
  request_model.SendMessageRequest:
    properties:
      content:
        type: string
      reply_to_message_id:
        type: string
    required:
    - content
    type: object
  request_model.UpdateJobRoleRequest:
    properties:
      name:
        type: string
      sector_id:
        type: string
    required:
    - name
    - sector_id
    type: object
  request_model.UpdateJobTitleRequest:
    properties:
      name:
        type: string
      sector_id:
        type: string
    required:
    - name
    - sector_id
    type: object
  request_model.UpdatePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    type: object
  request_model.UpdateProfileRequest:
    properties:
      birthdate:
        description: Expecting YYYY-MM-DD
        type: string
      gpa:
        type: number
      job_role_ids:
        items:
          type: string
        type: array
      kabupaten_kota_id:
        type: string
      major:
        type: string
      name:
        type: string
      phone_number:
        type: string
      portofolio_link:
        type: string
      school_university:
        type: string
      summary:
        type: string
      tech_stack:
        items:
          type: string
        type: array
      years_experience:
        type: integer
    type: object
  request_model.UpdateRecruitmentStatusRequest:
    properties:
      hex_code:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    required:
    - name
    type: object
  request_model.UpdateRequestRequest:
    properties:
      due_date:
        type: string
      project_name:
        type: string
      urgency:
        enum:
        - Low
        - Medium
        - High
        type: string
    required:
    - project_name
    - urgency
    type: object
  request_model.UpdateSectorRequest:
    properties:
      hex_code:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  request_model.UpdateSubrequestRequest:
    properties:
      job_role_id:
        type: string
      min_years_experience:
        minimum: 0
        type: integer
      notes:
        type: string
      tech_stack:
        items:
          type: string
        type: array
    required:
    - min_years_experience
    type: object
  response.Base:
    properties:
      data: {}
      message:
        type: string
      status:
        type: integer
      validation:
        additionalProperties:
          type: string
        type: object
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  license:
    name: Apache 2.0
