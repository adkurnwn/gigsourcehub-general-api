paths:
  /ai-chat:
    get:
      consumes:
      - application/json
      description: Fetch My Chats
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Fetch My Chats
      tags:
      - AI Chat
    post:
      consumes:
      - application/json
      description: Create Chat
      parameters:
      - description: Create Chat Request (first_query)
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Create Chat
      tags:
      - AI Chat
  /ai-chat/{id}:
    delete:
      consumes:
      - application/json
      description: Delete Chat
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Delete Chat
      tags:
      - AI Chat
  /ai-chat/{id}/messages:
    get:
      consumes:
      - application/json
      description: Fetch Chat Messages
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Fetch Chat Messages
      tags:
      - AI Chat
    post:
      consumes:
      - application/json
      description: Store Chat Message
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      - description: Store Message Request (role, content, is_last)
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Store Chat Message
      tags:
      - AI Chat
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Request password reset link
      parameters:
      - description: Forgot Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_model.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      summary: Forgot password
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login use email and password
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gorm_model.UserResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      summary: Login as user
      tags:
      - Auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Get detail current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gorm_model.AuthMeResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Detail user
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_model.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gorm_model.UserResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      summary: Register user
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset password use token from email
      parameters:
      - description: Reset Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_model.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      summary: Reset password
      tags:
      - Auth
  /auth/verify:
    get:
      consumes:
      - application/json
      description: Verify account use token from email
      parameters:
      - description: Verification Token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      summary: Verify account
      tags:
      - Auth
  /bookmarks:
    get:
      description: Get paginated list of bookmarks for the authenticated admin
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Limit per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: 'Fetch Admin Bookmarks (note: endpoint /users/candidates bisa digunakan
        juga, hasil nempel ditiap kandidat)'
      tags:
      - Bookmarks
    post:
      consumes:
      - application/json
      description: Admin bookmarks a candidate user
      parameters:
      - description: Create Bookmark Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_model.CreateBookmarkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Create Bookmark
      tags:
      - Bookmarks
  /bookmarks/{candidate_id}:
    delete:
      description: Admin removes a bookmarked candidate
      parameters:
      - description: Candidate User ID
        in: path
        name: candidate_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Base'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Delete Bookmark
      tags:
      - Bookmarks
  /chats:
    get:
      description: Get paginated list of conversations for the authenticated user
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Limit per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: List my conversations
      tags:
      - Chat
    post:
      consumes:
      - application/json
      description: Admin creates a new chat conversation scoped to a subrequest
      parameters:
      - description: Create Conversation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_model.CreateConversationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Create a conversation with a candidate
      tags:
      - Chat
  /chats/{id}:
    get:
      description: Get a specific conversation by ID
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Get conversation detail
      tags:
      - Chat
  /chats/{id}/messages:
    get:
      description: Get paginated messages for a conversation (newest first, default
        20)
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Limit per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: List messages in a conversation
      tags:
      - Chat
    post:
      consumes:
      - application/json
      description: Send a message in a conversation
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - description: Send Message
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request_model.SendMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Send a message
      tags:
      - Chat
  /chats/{id}/read:
    put:
      description: Mark all unread messages from the other participant as read
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Mark messages as read
      tags:
      - Chat
  /cv/confirm:
    post:
      consumes:
      - application/json
      description: Confirm the parsed CV data after editing
      parameters:
      - description: Edited CV data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request_model.ConfirmCVRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Confirm parsed CV data
      tags:
      - CV
  /cv/generate:
    get:
      description: Get presigned CV download link for current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
