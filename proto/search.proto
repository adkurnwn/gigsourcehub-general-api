syntax = "proto3";

package search;

option go_package = "gigsourcehub-ai-api/proto"; // (Adjust this package name on your general-api repo of course)

// 1. Add this import at the top
import "google/protobuf/struct.proto";

service SearchService {
  rpc Search (SearchRequest) returns (SearchResponse);
}

message SearchRequest {
  string query = 1;
  // Add other filters if necessary
}

message SearchResult {
  string id = 1;
  
  // 2. Change this line from "string content = 2;" to:
  google.protobuf.Struct content = 2;
  
  float score = 3;
  // Add metadata or other fields as needed
}

message SearchResponse {
  repeated SearchResult results = 1;
  string message = 2;
}
